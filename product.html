<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products — Apex Keychain</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="page-header">

        <p>THE COLLECTION</p>

        <h1>
            OUR <span>PRODUCTS</span>
        </h1>

    </section>


    <section class="products">


        <!-- PRODUCT 1 -->
        <div class="product">

            <div class="product-slider">

                <img
                    src="images/product-1-1.jpeg"
                    class="slide active"
                    alt="Product 1">

                <img
                    src="images/product-1-2.jpeg"
                    class="slide"
                    alt="Product 1">

                <img
                    src="images/product-1-3.jpeg"
                    class="slide"
                    alt="Product 1">

                <button class="prev" onclick="changeSlide(this, -1)">
                    ←
                </button>

                <button class="next" onclick="changeSlide(this, 1)">
                    →
                </button>

                <div class="slide-counter">
                    <span class="current">1</span> / 3
                </div>

            </div>

            <div class="product-info">

                <p>RACING COLLECTION</p>

                <h2>RACING KEYCHAIN</h2>

                <strong>Rp49.000</strong>

            </div>

        </div>


        <!-- PRODUCT 2 -->
        <div class="product">

            <div class="product-slider">

                <img
                    src="images/product-2-1.jpeg"
                    class="slide active"
                    alt="Product 2">

                <img
                    src="images/product-2-2.jpeg"
                    class="slide"
                    alt="Product 2">

                <img
                    src="images/product-2-3.jpeg"
                    class="slide"
                    alt="Product 2">

                <button class="prev" onclick="changeSlide(this, -1)">
                    ←
                </button>

                <button class="next" onclick="changeSlide(this, 1)">
                    →
                </button>

                <div class="slide-counter">
                    <span class="current">1</span> / 3
                </div>

            </div>

            <div class="product-info">

                <p>DRIVER COLLECTION</p>

                <h2>DRIVER KEYCHAIN</h2>

                <strong>Rp55.000</strong>

            </div>

        </div>


    </section>


    <script>

        function changeSlide(button, direction) {

            const slider = button.parentElement;

            const slides = slider.querySelectorAll(".slide");

            let currentIndex = 0;

            slides.forEach((slide, index) => {

                if (slide.classList.contains("active")) {
                    currentIndex = index;
                }

            });


            slides[currentIndex].classList.remove("active");


            let newIndex = currentIndex + direction;


            if (newIndex >= slides.length) {
                newIndex = 0;
            }

            if (newIndex < 0) {
                newIndex = slides.length - 1;
            }


            slides[newIndex].classList.add("active");


            slider.querySelector(".current").textContent =
                newIndex + 1;

        }

    </script>

</body>
</html>
